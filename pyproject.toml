[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ps5-tr-voice"
version = "0.1.0"
description = "Windows companion app for live English-to-Turkish game voice translation"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7,<7",
    "sounddevice>=0.4.7,<1",
    "numpy>=1.26,<3",
    "python-dotenv>=1.0,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
